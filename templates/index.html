<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spam Detection System</title>

    <style>

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            color: #eff6ff;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card {
            position: relative;
            top: 10px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(148, 163, 184, 0.22);
            padding: 30px;
            width: 420px;
            border-radius: 22px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.45), 0 0 0 1px rgba(56, 189, 248, 0.12);
            text-align: center;
            backdrop-filter: blur(10px);
            z-index: 2;
        }

        h1 {
            margin-bottom: 10px;
            color: #eff6ff;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1.4px;
        }

        h5 {
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #111827;
            color: #eff6ff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #22d3ee, #2563eb);
            color: #eff6ff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            box-shadow: 0 10px 18px rgba(37, 99, 235, 0.35);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(56, 189, 248, 0.35);
        }

        .result {
            margin-top: 18px;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        .spam {
            color: red;
        }

        .ham {
            color: green;
        }
    </style>
</head>

<body>
<div class="card">
    <h1><b>SPAM SMS/MAIL DETECTION</b></h1>
    <h5>Enter your message below to check if it's SPAM or NOT SPAM:</h5>

    <form method="POST" action="/predict">
        <textarea name="message" placeholder="Type your message here"></textarea>
        <button type="submit">Check</button>
    </form>

    {% if label %}
    {% if label == "SPAM" %}
        <div class="result spam">
            SPAM ({{ confidence }}%)
        </div>
    {% else %}
        <div class="result ham">
            NOT SPAM ({{ confidence }}%)
        </div>
    {% endif %}
{% endif %}

</div>

</body>
</html>
